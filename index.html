<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./img/fav-icon.png">
    <link rel="preload" href="./assets/figtree-normal.woff2" as="font" type="font/woff2" crossorigin>
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
    <script src="script.js" defer></script>
    
</head>

<body onload="init()">

<header class="page-header">
    <div class="header-content wrapper-wide"> 
        <div>
            <img src="./img/Capa_2.svg" alt="Fotogram-Logo">
        </div>
    </div>
</header>

    <main>

        <section class="wrapper page-content">

            <h1>Your personal photo album</h1>

            <div id="imageContent" class="album" role="list">

            </div>


            <dialog onclick="outsideClick(event)" id="imageModal" class="popUpField" aria-labelledby="dialog-headline" aria-modal="true">

                <div class="dialogContent" onclick="event.stopPropagation()">

                <header>
                    <h2 id="dialog-headline">Mein Text</h2>
                    <button aria-label="Dialog Schließen" class="close-icon" onclick="closeDialog()"><img src="./img/close.svg" alt="close"></button>
                </header>


                <section class="dialog-image-container">
                    <img id="dialogImage" class="dialog-picture" src="" alt="">
                </section>

                <footer class="dialog-footer-navigation">
                    <button aria-label="Vorheriges Bild" onclick="prevPic()"><img src="./img/prev.svg" alt="back"></button>
                    <span id="img-counter" aria-live="polite">1 / 12</span>
                    <button aria-label="Nächstes Bild" onclick="nextPic()"><img src="./img/next.svg" alt="skip"></button>
                </footer>

                </div>
            </dialog>

        </section>
    </main>


    <footer class="footer">
        
        <section class="wrapper-wide footer-content">
            <a href="https://developer-akademie.teachable.com/"><img src="./img/Frame 6.png" alt="Visit the Developer Academy website"></a>
        </section>
    </footer>



</body>

</html>
