<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./img/fav-icon.png">
    
</head>

<body>

<header class="page-header">
    <div class="header-content wrapper-wide"> 
        <div>
            <img src="./img/Capa_2.svg" alt="Fotogram-Logo">
        </div>
    </div>
</header>

    <main>

        <section class="wrapper page-content">

            <h1>Your personal photo album</h1>

            <div id="content" class="album">
                <button onclick="openDialog(0)" class="content-btn"><img src="./img/wolves.jpg" alt="wolf image"></button>
                <button onclick="openDialog(1)" class="content-btn"><img src="./img/lamm.jpg" alt="sheep puppy image"></button>
                <button onclick="openDialog(2)" class="content-btn"><img src="./img/ducks.jpg" alt="ducks image"></button>
                <button onclick="openDialog(3)" class="content-btn"><img src="./img/habichtskauz.jpg" alt="habichtskauz image"></button>
                <button onclick="openDialog(4)" class="content-btn"><img src="./img/puppys.jpg" alt="dog image"></button>
                <button onclick="openDialog(5)" class="content-btn"><img src="./img/hase.jpg" alt="rabbit image"></button>
                <button onclick="openDialog(6)" class="content-btn"><img src="./img/merkats.jpg" alt="meerkats Image"></button>
                <button onclick="openDialog(7)" class="content-btn"><img src="./img/mole.jpg" alt="mole image"></button>
                <button onclick="openDialog(8)" class="content-btn"><img src="./img/rhino.jpg" alt="rhino"></button>
                <button onclick="openDialog(9)" class="content-btn"><img src="./img/hawk.jpg" alt="hawk image"></button>
                <button onclick="openDialog(10)" class="content-btn"><img src="./img/grizzli.jpg" alt="grizzlies image"></button>
                <button onclick="openDialog(11)" class="content-btn"><img src="./img/horses.jpg" alt="horses image"></button>
            </div>


            <dialog  id="imageModal" class="popUpField">

                <div class="dialogContent">

                <header>
                    <h2 id="dialog-headline">Mein Text</h2>
                    <button class="close-icon" onclick="closeDialog()"><img src="./img/close.svg" alt="close"></button>
                </header>


                <section class="dialog-image-container">
                    <img id="dialogImage" class="dialog-picture" src="" alt="">
                </section>

                <footer class="dialog-footer-navigation">
                    <button onclick="prevPic()"><img src="./img/prev.svg" alt="back"></button>
                    <span id="img-counter">1 / 12</span>
                    <button onclick="nextPic()"><img src="./img/next.svg" alt="skip"></button>
                </footer>

                </div>
            </dialog>

        </section>
    </main>


    <footer class="footer">
        
        <section class="wrapper-wide footer-content">
            <a href="https://developer-akademie.teachable.com/"><img src="./img/Frame 6.png" alt="Developer Akademie Logo"></a>
        </section>
    </footer>


<script src="script.js" defer></script>
</body>

</html>
