<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./img/fav-icon.png">
</head>

<body>

    <header class="page-header">
        <div class="header-content wrapper">
            <div>
                <img src="./img/Capa_2.svg" alt="Fotogram-Logo">
            </div>
        </div>
    </header>

    <main>
        <section class="wrapper page-content">
            
            <div class="picture-container">
                                
                    <h1>Your personal photo album</h1>
                    <button onclick="" class="content-btn"><img src="./img/wolves.jpg" alt="wolf image"></button>
                    <button class="content-btn"><img src="./img/lamm.jpg" alt="sheep puppy image"></button>
                    <button class="content-btn"><img src="./img/ducks.jpg" alt="ducks image"></button>
                    <button class="content-btn"><img src="./img/habichtskauz.jpg" alt="habichtskauz image"></button>
                    <button class="content-btn"><img src="./img/puppys.jpg" alt="dog image"></button>
                    <button class="content-btn"><img src="./img/hase.jpg" alt="rabbit image"></button>
                    <button class="content-btn"><img src="./img/merkats.jpg" alt="Meerkats Image"></button>
                    <button class="content-btn"><img src="./img/mole.jpg" alt="mole image"></button>
                    <button class="content-btn"><img src="./img/rhino.jpg" alt="rhino"></button>
                    <button class="content-btn"><img src="./img/hawk.jpg" alt="hawk image"></button>
                    <button class="content-btn"><img src="./img/grizzli.jpg" alt="grizzlies image"></button>
                    <button class="content-btn"><img src="./img/horses.jpg" alt="horses image"></button>
            </div>
        </section>
    </main>


    <footer>
        <section class="wrapper">

        </section>
    </footer>

</body>

</html>
